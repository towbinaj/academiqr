<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://natzpfyxpuycsuuzbqrd.supabase.co; connect-src 'self' https://*.supabase.co; font-src 'self';">
  <title>AcademiQR — Dashboard</title>
  <meta name="description" content="Manage your AcademiQR link collections — create, organize, and share resources with your audience.">
  <link rel="canonical" href="https://academiqr.com/src/pages/dashboard.html">
  <link rel="icon" type="image/png" href="https://natzpfyxpuycsuuzbqrd.supabase.co/storage/v1/object/public/assets/AcademiQR_logo_blue_favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="https://natzpfyxpuycsuuzbqrd.supabase.co/storage/v1/object/public/assets/AcademiQR_logo_white_.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="https://natzpfyxpuycsuuzbqrd.supabase.co/storage/v1/object/public/assets/AcademiQR_logo_blue.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A2F5B">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/pages/dashboard.css">
</head>
<body>
  <div id="app">
    <!-- Top Nav -->
    <nav id="main-nav" class="main-nav"></nav>

    <!-- Dashboard -->
    <main class="dashboard">
      <header class="dashboard-header">
        <h1>My Collections</h1>
        <div class="dashboard-header-actions">
          <div class="search-wrapper" id="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="collection-search" placeholder="Search collections..." class="search-input">
          </div>
          <button class="btn-primary" id="new-collection-btn">+ New Collection</button>
        </div>
      </header>
      <div id="tag-filter-bar" class="tag-filter-bar" style="display:none;"></div>
      <div id="collections-grid" class="collections-grid">
        <!-- Collection cards rendered by JS -->
      </div>
    </main>
  </div>
  <script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
